# ========================================================
# Render.com Blueprint Specification
# Deploys:
#   1. PostgreSQL Database (Free tier)
#   2. Spring Boot REST API (Docker Web Service)
#   3. React Vite Frontend (Static Site)
# ========================================================

services:
  # ------------------------------------------------------
  # Spring Boot Backend API
  # ------------------------------------------------------
  - type: web
    name: student-backend
    runtime: docker
    rootDir: student
    dockerfilePath: student/Dockerfile
    dockerContext: student
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: student-db
          property: connectionString
      - key: PORT
        value: "8080"
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update

  # ------------------------------------------------------
  # Vite + React Frontend Application (Static Site)
  # Note: Static sites are served via global CDN, so no region key
  # ------------------------------------------------------
  - type: web
    name: student-frontend
    runtime: static
    rootDir: student-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: student-frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: student-backend
          property: host

# --------------------------------------------------------
# PostgreSQL Database Service
# --------------------------------------------------------
databases:
  - name: student-db
    databaseName: db_student
    user: postgres
    plan: free
    region: oregon
